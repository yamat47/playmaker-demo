# Builds the site from main and publishes it to GitHub Pages (https://playmaker-demo.yamat47.me/).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A rollout in progress finishes before the next one starts.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: yamat47/github-toolkit/actions/checkout@main
        with:
          persist-credentials: false

      - name: Setup Node.js with pnpm and install dependencies
        uses: yamat47/github-toolkit/actions/setup-node-with-pnpm@main
        with:
          node-version-file: .node-version

      # CI runs in parallel with this workflow, so the checks that decide whether the site works
      # are repeated here before anything is published.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Build (Vite)
        run: pnpm run build

      - name: Upload the site
        uses: yamat47/github-toolkit/actions/upload-pages-artifact@main
        with:
          path: dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # deploy-pages creates the deployment
      id-token: write # deploy-pages proves the artifact came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy
        uses: yamat47/github-toolkit/actions/deploy-pages@main
